<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Take two;Akan Name Generator</title>

</head>
<body>
<link rel="stylesheet" href="style.css">
<div class="stars-container"></div>

<div class="container">

    <h1>Akan Name Generator</h1>

    <p>.Enter your birth date and select your gender to discover your Akan name.</p>
    <p>.Akan names were traditionaly used in ghana as their naming system</p>
    <p>.To this day it is still an important part of their culture</p>
    <p>.This website helps to spread that culture,one name at a time</p>
    <label for="day">Day</label>
    <input type="number" id="day" min="1" max="31" placeholder="Enter day">

    <label for="month">Month</label>
    <input type="number" id="month" min="1" max="12" placeholder="Enter month">

    <label for="year">Year</label>
    <input type="number" id="year" placeholder="Enter year">

    <div class="gender">
        <strong>Gender</strong><br><br>

        <label>
            <input type="radio" name="gender" value="male">
            Male
        </label>

        <label>
            <input type="radio" name="gender" value="female">
            Female
        </label>
    </div>

    <button onclick="generateAkanName()">
        Generate Akan Name
    </button>

    <div id="result"></div>

</div>
<script src="script.js"></script>

</body>
</html>
